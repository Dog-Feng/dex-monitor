# 生产环境公网部署示例（复制为 config.yaml 后按需修改）
# 详见 docs/DEPLOY.md

poll_interval_seconds: 60
kline_interval: "5m"

discovery:
  enabled: true
  mode: dynamic
  top_gainers: 25
  top_losers: 25
  min_quote_volume_usdt: 5000000
  min_change_15m: 0.03
  bars_15m: 3
  fallback_top_n: 15
  exclude_tradfi: true
  refresh_interval_seconds: 300
  exclude_symbols:
    - BTCUSDT
    - ETHUSDT

symbols: []

coingecko:
  enabled: true
  api_key: ""
  chain_priority:
    - binance-smart-chain
    - base
    - ethereum
    - arbitrum-one
  metadata_refresh_hours: 24
  unlock_lookahead_days: 30

detection:
  surge_pct: 0.08
  dump_pct: 0.08
  vol_multiplier: 3.0
  oi_drop_pct: 0.05
  oi_rise_pct: 0.05
  funding_positive_threshold: 0.0005
  funding_extreme_positive: 0.001
  funding_extreme_negative: -0.005
  oi_mcap_ratio_warn: 0.2
  oi_mcap_ratio_high: 0.3

chain:
  enabled: false
  l1_interval_seconds: 300
  l2_mode: lazy
  min_transfer_usd: 10000
  etherscan_api_key: ""
  bscscan_api_key: ""
  rpc:
    bsc: "https://bsc-dataseed.binance.org"

alert:
  cooldown_minutes: 30
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

sqlite:
  path: data/monitor.db
  metrics_retention_days: 30

logging:
  level: INFO
  file: data/app.log

# 公网无鉴权：监听所有网卡
web:
  enabled: true
  host: 0.0.0.0
  port: 8089
