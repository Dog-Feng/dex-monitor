<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代币异常监控台 · 静态预览</title>
  <link rel="stylesheet" href="/css/console.css" />
  <link rel="stylesheet" href="/css/monitor.css" />
</head>
<body>
  <header class="header">
    <div class="header-logo">代币异常<span>监控台</span></div>
    <div class="header-sep"></div>
    <div class="ex-chips">
      <span class="ex-chip"><i class="hdot ok"></i>监控中</span>
      <span class="ex-chip">Binance 永续</span>
      <span class="ex-chip">BSC 优先</span>
      <span class="ex-chip preview-badge">静态预览</span>
    </div>
    <div class="header-right">
      <span class="conn"><i class="hdot ok"></i><span>Mock 数据</span></span>
      <span class="clock" id="clock">—</span>
    </div>
  </header>

  <nav class="main-tabs">
    <button class="tab-btn active" data-tab="monitor">异常监控</button>
    <button class="tab-btn" data-tab="tokens">代币库</button>
  </nav>

  <main class="wrap">
    <div class="static-banner warn">
      静态预览页：每 3 秒模拟一次行内数据刷新。15M / 24H / 费率列可点击排序。确认效果后再接入真实 API。
      正式入口：<a href="/" style="color:#c4b5fd">/</a>
    </div>

    <section id="tab-monitor" class="tab-panel active">
      <div class="panel panel-table">
        <div class="panel-title">
          <span>代币监控 · 一行一币</span>
          <span class="panel-meta">共 <strong id="token-count">0</strong> 个 · 更新于 <strong id="last-refresh">—</strong></span>
        </div>
        <div class="table-scroll">
          <table class="tbl-monitor" id="tbl-monitor">
            <colgroup>
              <col class="col-sym" />
              <col class="col-price" />
              <col class="col-pct" />
              <col class="col-pct" />
              <col class="col-fund" />
              <col class="col-oi" />
              <col class="col-ratio" />
              <col class="col-whale" />
              <col />
            </colgroup>
            <thead>
              <tr>
                <th>代币</th>
                <th>价格</th>
                <th class="sortable" data-sort="change_15m">
                  <button type="button" class="sort-btn">15M <span class="sort-icon">↕</span></button>
                </th>
                <th class="sortable" data-sort="change_24h">
                  <button type="button" class="sort-btn">24H <span class="sort-icon">↕</span></button>
                </th>
                <th class="sortable" data-sort="funding_rate">
                  <button type="button" class="sort-btn">费率 <span class="sort-icon">↕</span></button>
                </th>
                <th>OI</th>
                <th>
                  <span class="th-tip" title="未平仓合约(OI)名义价值 ÷ 流通市值。比值越高，杠杆持仓相对市值越集中，波动/清算风险越大。">OI÷市值</span>
                </th>
                <th>
                  <span class="th-tip" title="Binance 大户账户多空比 = 持多大户数 ÷ 持空大户数。&gt;1 表示大户偏多，&lt;1 表示大户偏空，=1 表示大致均衡。">大户多空比</span>
                </th>
                <th class="col-conclusion">结论</th>
              </tr>
            </thead>
            <tbody id="monitor-body"></tbody>
          </table>
        </div>
      </div>

      <div class="panel detail-panel">
        <div class="panel-title">归因说明 <span class="panel-meta" id="detail-symbol">点击表格行查看</span></div>
        <div id="narrative" class="narrative-box">—</div>
      </div>
    </section>

    <section id="tab-tokens" class="tab-panel">
      <div class="panel panel-table">
        <div class="panel-title">token_metadata 持久化合约库</div>
        <div class="table-scroll">
          <table class="tbl-monitor tbl-tokens">
            <colgroup>
              <col class="tk-base" />
              <col class="tk-symbol" />
              <col class="tk-chain" />
              <col class="tk-contract" />
              <col class="tk-cg" />
              <col class="tk-updated" />
            </colgroup>
            <thead>
              <tr>
                <th>Base</th>
                <th>永续</th>
                <th>链</th>
                <th>合约</th>
                <th>CoinGecko</th>
                <th>更新</th>
              </tr>
            </thead>
            <tbody id="tokens-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/preview.js"></script>
</body>
</html>
